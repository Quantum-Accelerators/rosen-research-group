name: Website CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with latest Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Save built website
        uses: actions/upload-artifact@v5
        with:
          name: built-website
          path: dist/
          if-no-files-found: error
          retention-days: 14
